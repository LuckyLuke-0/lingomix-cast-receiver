name: Deploy Cast Receiver to GitHub Pages

on:
  push:
    branches: [main, feature/direct-cast-modes]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Receiver compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check legacy-compatible JavaScript and run tests
        run: |
          node --check receiver-core.js
          node --check receiver-trevuxa.js
          node --test test/*.test.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Stage only production receiver files
        run: |
          mkdir -p _site
          sed "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html > _site/index.html
          cp receiver-core.js receiver-trevuxa.js styles.css privacy-policy.html terms.html _site/
      - name: Upload receiver
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
